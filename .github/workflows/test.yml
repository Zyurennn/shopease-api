name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://localhost:27017/shopease_test
      JWT_SECRET: ci-test-secret

    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm install

      - run: npm test